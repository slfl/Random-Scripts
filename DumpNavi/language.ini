# DumpNAVI GUI translations.
#
# One section per language. The section name is what appears in the language
# menu (bottom-right of the window). To add a language, copy a whole block,
# rename it (e.g. [Italiano]) and translate the values - it will appear in the
# menu automatically. The special key `code` is the 2-letter badge shown in the
# corner (EN, RU, IT, ...). Placeholders like {0}, {1} must be kept as-is, and
# \n means a line break.
#
# Keys not translated for a language fall back to English, then to the key name,
# so a partial translation is fine.

